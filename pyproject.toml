[project]
name = "log-inspector"
version = "0.1.0"
description = "Query AWS CloudWatch logs and diagnose root causes of issues."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "boto3>=1.43.104",
    "sqlalchemy>=2.0",
    "anthropic>=1.11.0",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.2",
    "mangum>=0.19",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
log-inspector = "log_inspector.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "moto[iam,logs,sts]>=5",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Mangum calls asyncio.get_event_loop(), deprecated in Python 3.12; harmless.
    "ignore:There is no current event loop:DeprecationWarning:mangum.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
